# Stub origin behind the CRS reverse-proxy. Returns 200 "ok" on ordinary paths
# and methods so go-ftw can drive any endpoint (/status/200, /wp-login.php,
# /?orderby=..., /xmlrpc.php, …) and assert purely on the ModSecurity audit
# log. The named response-oracle paths serve PHP tutorial text so CRS response
# rules 953100, 953110, and 953120 can be tested end to end. The WAF runs in
# DetectionOnly, so nothing is blocked.
events {}
http {
    access_log off;
    server {
        listen 80 default_server;
        server_name _;
        location ~ ^/(?:2026/05/(?:nginx-angie-the-expert-guide-to-maximum-performance-and-security|zstd-nginx-module-what-it-does-bugs-fixed|postfix-dovecot-setup-debian)/|wp-admin/953-response-oracle|wp-json/953-response-oracle)$ {
            default_type text/html;
            return 200 '<html><body><pre>Fatal error: readfile <?php echo "tutorial"; ?></pre></body></html>';
        }
        location = /9522701-response-oracle {
            default_type text/plain;
            add_header X-Pingback 'https://example.test/xmlrpc.php';
            return 200 'ok';
        }
        location = /9522702-response-oracle {
            default_type text/plain;
            add_header X-Powered-By 'PHP/8.3';
            return 200 'ok';
        }
        location = /9522703-response-oracle {
            default_type text/plain;
            add_header Link '<https://api.w.org/>; rel="https://api.w.org/"';
            return 200 'ok';
        }
        location = /9522700-response-oracle-control {
            default_type text/plain;
            add_header X-Powered-By 'nginx';
            add_header Link '<https://example.test/>; rel="alternate"';
            return 200 'ok';
        }
        location / {
            default_type text/plain;
            return 200 'ok';
        }
    }
}
