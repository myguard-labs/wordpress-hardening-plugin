          port: 80
          method: GET
          uri: /wp-content/plugins/some-backup-plugin/style.css
        output:
          log_not_contains: id "9522303"
  - test_title: 9522303-12
    desc: Allow benign backup-like path /wp-content/plugins/backup-manager/style.css
