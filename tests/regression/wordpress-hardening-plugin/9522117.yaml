---
meta:
  author: Thijs Eilander
  description: wordpress-hardening-plugin
  enabled: true
  name: 9522117.yaml
tests:
  - test_title: 9522117-1
    desc: SureTriggers /wp-json route probe is blocked (CVE-2025-3102)
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /wp-json/sure-triggers/v1/connection/create-wp-connection
          data: |
            {"client_id":"x"}
        output:
          log_contains: id "9522117"
  - test_title: 9522117-2
    desc: SureTriggers via index.php?rest_route alternate path is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /index.php?rest_route=/sure-triggers/v1/connection/create-wp-connection
          data: |
            {}
        output:
          log_contains: id "9522117"
  - test_title: 9522117-3
    desc: Encoded SureTriggers route (%73) is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /wp-json/%73ure-triggers/v1/x
          data: |
            {}
        output:
          log_contains: id "9522117"
  - test_title: 9522117-4
    desc: Uppercase encoded namespace is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /wp-json/%53URE-TRIGGERS/v1/x
          data: |
            {}
        output:
          log_contains: id "9522117"
  - test_title: 9522117-5
    desc: Encoded wp-json prefix (%6A) is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /wp-%6Ason/sure-triggers/v1/x
          data: |
            {}
        output:
          log_contains: id "9522117"
  - test_title: 9522117-6
    desc: Encoded rest_route value is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /index.php?rest_route=%2Fsure-triggers%2Fv1%2Fx
          data: |
            {}
        output:
          log_contains: id "9522117"
  - test_title: 9522117-7
    desc: Absolute-form encoded SureTriggers route is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: http://localhost/wp-json/%73ure-triggers/v1/x
          data: |
            {}
        output:
          log_contains: id "9522117"
  - test_title: 9522117-8
    desc: Negative - benign encoded REST route is not blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /wp-json/wp/v2/p%6fsts
          data: |
            {}
        output:
          no_log_contains: id "9522117"
  - test_title: 9522117-9
    desc: Negative - double-encoded route is not decoded twice
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /wp-json/%2573ure-triggers/v1/x
          data: |
            {}
        output:
          no_log_contains: id "9522117"
  - test_title: 9522117-10
    desc: Negative - SureTriggers path only in an unrelated query string
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /blog/?q=/wp-json/sure-triggers/v1/
          data: |
            {}
        output:
          no_log_contains: id "9522117"
  - test_title: 9522117-11
    desc: Traversal in the query string cannot erase the route
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /wp-json/sure-triggers/v1/x?q=%2F..%2F..%2F..%2F..%2Fsafe
          data: |
            {}
        output:
          log_contains: id "9522117"
  - test_title: 9522117-12
    desc: rest_route after another parameter is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /?a=%2F..%2F..&rest_route=/sure-triggers/v1/x
          data: |
            {}
        output:
          log_contains: id "9522117"
  - test_title: 9522117-13
    desc: rest.route (PHP rewrites it to rest_route) is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /index.php?rest.route=/sure-triggers/v1/x
          data: |
            {}
        output:
          log_contains: id "9522117"
  - test_title: 9522117-14
    desc: Negative - benign REST route with traversal in the query is not blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /wp-json/wp/v2/posts?q=%2F..%2F..%2Fsafe
          data: |
            {}
        output:
          no_log_contains: id "9522117"
  - test_title: 9522117-15
    desc: Negative - SureTriggers route after query traversal is not blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /wp-json/wp/v2/posts?q=/../wp-json/sure-triggers/v1/
          data: |
            {}
        output:
          no_log_contains: id "9522117"
  - test_title: 9522117-16
    desc: Negative - SureTriggers namespace without /wp-json is an ordinary permalink
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /sure-triggers/v1/x
          data: |
            {}
        output:
          no_log_contains: id "9522117"
  - test_title: 9522117-17
    desc: Negative - /wp-json without its trailing slash is not the REST prefix
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /wp-jsonsure-triggers/v1/x
          data: |
            {}
        output:
          no_log_contains: id "9522117"
  - test_title: 9522117-18
    desc: Negative - argument name that only resembles rest_route is not blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /blog/?restXroute=/sure-triggers/v1/x
          data: |
            {}
        output:
          no_log_contains: id "9522117"
  - test_title: 9522117-19
    desc: Negative - rest_route value is not URL-decoded a second time
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /index.php?rest_route=/%2573ure-triggers/v1/x
          data: |
            {}
        output:
          no_log_contains: id "9522117"
  - test_title: 9522117-20
    desc: rest[route (PHP rewrites an unclosed [ to _) is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: POST
          uri: /index.php?rest%5Broute=/sure-triggers/v1/x
          data: |
            {}
        output:
          log_contains: id "9522117"
