---
meta:
  author: Thijs Eilander
  description: wordpress-hardening-plugin
  enabled: true
  name: 9522112.yaml
tests:
  - test_title: 9522112-1
    desc: CVE-2018-6389 — long load= on load-scripts.php is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-scripts.php?load=jquery,jquery-ui-core,\
            jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,\
            wp-util,wp-a11y,wp-i18n"
        output:
          log_contains: id "9522112"
  - test_title: 9522112-2
    desc: CVE-2018-6389 — long load[]= array form is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-styles.php?load[]=common,forms,admin-menu,\
            dashboard,list-tables,edit,revisions,media,buttons,\
            wp-jquery-ui-dialog,thickbox,thumbnail"
        output:
          log_contains: id "9522112"
  - test_title: 9522112-3
    desc: Negative — short legitimate load= must not match
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/load-scripts.php?load=jquery,common
        output:
          no_log_contains: id "9522112"
  - test_title: 9522112-4
    desc: Encoded load-scripts.php path with a long load list is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-%73cripts.php?load=jquery,jquery-ui-core,\
            jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,\
            wp-util,wp-a11y,wp-i18n"
        output:
          log_contains: id "9522112"
  - test_title: 9522112-5
    desc: >-
      Negative — an encoded path with a short legitimate load list is allowed
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/load-%73cripts.php?load=jquery,common
        output:
          no_log_contains: id "9522112"
  - test_title: 9522112-6
    desc: Double-encoded load-scripts.php path is not decoded twice
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-%2573cripts.php?load=jquery,jquery-ui-core,\
            jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,\
            wp-util,wp-a11y,wp-i18n"
        output:
          no_log_contains: id "9522112"
  - test_title: 9522112-7
    desc: Percent-encoded load array name with a long value is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-styles.php?load%5B%5D=common,forms,admin-menu,\
            dashboard,list-tables,edit,revisions,media,buttons,thickbox"
        output:
          log_contains: id "9522112"
  - test_title: 9522112-8
    desc: Encoded ampersands cannot split a long load value below the limit
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-scripts.php?load=jquery%26jquery-ui-core%26\
            jquery-ui-widget%26jquery-ui-mouse%26jquery-ui-sortable%26\
            wp-pointer%26wp-util%26wp-a11y%26wp-i18n"
        output:
          log_contains: id "9522112"
  - test_title: 9522112-9
    desc: Indexed load array with a long value is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-scripts.php?load[0]=jquery,jquery-ui-core,\
            jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,\
            wp-util,wp-a11y,wp-i18n"
        output:
          log_contains: id "9522112"
  - test_title: 9522112-10
    desc: WordPress chunked load values beyond the core limit are blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-scripts.php?load[chunk_0]=\
            jquery,jquery-ui-core,jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,wp-util,wp-a11y,wp-i18n,\
            jquery,jquery-ui-core,jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,wp-util,wp-a11y,wp-i18n,\
            jquery,jquery-ui-core,jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,wp-util,wp-a11y,wp-i18n,\
            jquery,jquery-ui-core,jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,wp-util,wp-a11y,wp-i18n,\
            jquery,jquery-ui-core,jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,wp-util,wp-a11y,wp-i18n,\
            jquery,jquery-ui-core,jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,wp-util,wp-a11y,wp-i18n,\
            jquery,jquery-ui-core,jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,wp-util,wp-a11y,wp-i18n,\
            jquery,jquery-ui-core,jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,wp-util,wp-a11y,wp-i18n,\
            jquery,jquery-ui-core,jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,wp-util,wp-a11y,wp-i18n,\
            jquery,jquery-ui-core,jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,wp-util,wp-a11y,wp-i18n"
        output:
          log_contains: id "9522112"
  - test_title: 9522112-11
    desc: Repeated short load array values cannot evade the total limit
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-styles.php?load[]=common,forms,admin-menu&\
            load[]=dashboard,list-tables,edit&load[]=revisions,media,buttons,\
            thickbox,thumbnail"
        output:
          log_contains: id "9522112"
  - test_title: 9522112-12
    desc: Negative — short load with an unrelated long argument is allowed
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-scripts.php?load=jquery,common&unused=\
            abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz"
        output:
          no_log_contains: id "9522112"
  - test_title: 9522112-13
    desc: Negative — two short WordPress chunks stay below the limit
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-scripts.php?load[chunk_0]=jquery,common&\
            load[chunk_1]=utils"
        output:
          no_log_contains: id "9522112"
  - test_title: 9522112-14
    desc: Negative — ordinary WordPress core chunks exceed 80 bytes safely
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-scripts.php?load[chunk_0]=jquery,jquery-ui-core,\
            jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,\
            wp-util,wp-a11y,wp-i18n&load[chunk_1]=common,utils"
        output:
          no_log_contains: id "9522112"
  - test_title: 9522112-15
    desc: Named array element at the 80-byte boundary is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-scripts.php?load[x]=\
            aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\
            aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        output:
          log_contains: id "9522112"
  - test_title: 9522112-16
    desc: Named array element below the 80-byte boundary is allowed
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-scripts.php?load[x]=\
            aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\
            aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        output:
          no_log_contains: id "9522112"
