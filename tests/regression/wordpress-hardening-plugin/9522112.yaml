---
meta:
  author: Thijs Eilander
  description: wordpress-hardening-plugin
  enabled: true
  name: 9522112.yaml
tests:
  - test_title: 9522112-1
    desc: CVE-2018-6389 — long load= on load-scripts.php is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/load-scripts.php?load=jquery,jquery-ui-core,jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,wp-pointer,wp-util,wp-a11y,wp-i18n
        output:
          log_contains: id "9522112"
  - test_title: 9522112-2
    desc: CVE-2018-6389 — long load[]= array form is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/load-styles.php?load[]=common,forms,admin-menu,dashboard,list-tables,edit,revisions,media,buttons,wp-jquery-ui-dialog,thickbox,thumbnail
        output:
          log_contains: id "9522112"
  - test_title: 9522112-3
    desc: Negative — short legitimate load= must not match
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/load-scripts.php?load=jquery,common
        output:
          no_log_contains: id "9522112"
  - test_title: 9522112-90
    desc: raw load-styles.php with a long scalar load value is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-styles.php?load=jquery,jquery-ui-core,\
            jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,\
            wp-pointer,wp-util,wp-a11y,wp-i18n"
        output:
          log_contains: id "9522112"
  - test_title: 9522112-91
    desc: single-encoded-path for raw URI single-decode boundary
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-scr%69pts.php?load=jquery,jquery-ui-core,\
            jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,\
            wp-pointer,wp-util,wp-a11y,wp-i18n"
        output:
          log_contains: id "9522112"
  - test_title: 9522112-92
    desc: benign-encoded-path for raw URI single-decode boundary
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/load-scr%69pts.php?load=jquery,common
        output:
          no_log_contains: id "9522112"
  - test_title: 9522112-93
    desc: double-encoded-path for raw URI single-decode boundary
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-scr%2569pts.php?load=jquery,jquery-ui-core,\
            jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,\
            wp-pointer,wp-util,wp-a11y,wp-i18n"
        output:
          no_log_contains: id "9522112"
  - test_title: 9522112-94
    desc: long percent-encoded load[] key is blocked after lowercase folding
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: "/wp-admin/load-scripts.php?load%5B%5D=jquery,jquery-ui-core,\
            jquery-ui-widget,jquery-ui-mouse,jquery-ui-sortable,\
            wp-pointer,wp-util,wp-a11y,wp-i18n"
        output:
          log_contains: id "9522112"
  - test_title: 9522112-95
    desc: short percent-encoded load[] value stays below the block threshold
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/load-scripts.php?load%5B%5D=jquery,common
        output:
          no_log_contains: id "9522112"
