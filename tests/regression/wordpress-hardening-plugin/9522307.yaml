---
meta:
  author: Thijs Eilander
  description: wordpress-hardening-plugin
  enabled: true
  name: 9522307.yaml
tests:
  - test_title: 9522307-1
    desc: Apache decodes the outer encoding; the rule blocks uploads traversal
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: /wp-content/uploads/%252e%252e/wp-config.php
          data: |
            text
        output:
          log_contains: id "9522307"
  - test_title: 9522307-2
    desc: Test if traversal from a nested uploads directory is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: /wp-content/uploads/2024/%252e%252e/%252e%252e/wp-config.php
          data: |
            text
        output:
          log_contains: id "9522307"
  - test_title: 9522307-3
    desc: Test if traversal into wp-includes is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
          port: 80
          method: GET
          uri: "/wp-content/uploads/%252e%252e/%252e%252e/\
            %252e%252e/wp-includes/functions.php"
          data: |
            text
        output:
          log_contains: id "9522307"
  - test_title: 9522307-4
    desc: >
      Negative: a normal uploads request with no ".." sequence must NOT be
      flagged as traversal.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/uploads/2026/05/photo.jpg
        output:
          no_log_contains: id "9522307"
  - test_title: 9522307-5
    desc: >
      Apache decodes one encoding layer before ModSecurity evaluates
      REQUEST_URI.
      The rule's t:urlDecodeUni then decodes the remaining "%2e%2e" into ".."
      without normalizePath collapsing it. This traversal must be logged.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/uploads/%252e%252e/%252e%252e/wp-config.php
        output:
          log_contains: id "9522307"
  - test_title: 9522307-6
    desc: >
      Triple-encoded traversal leaves "%252e%252e" after Apache's decode and
      "%2e%2e" after the rule's single t:urlDecodeUni. This documents the
      residual one-pass decoding limit; the rule must not log this request.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/uploads/%25252e%25252e/wp-config.php
        output:
          no_log_contains: id "9522307"
