---
meta:
  author: Thijs Eilander
  description: >
    Front-end permalink CRS-953 PHP-leakage FP suppression: rule 9522801
    must schedule ctl:ruleRemoveById for 953100/953110/953120 on rendered
    blog-post paths, and MUST NOT do so on /wp-admin, /wp-login, REST,
    cron, xmlrpc, or static-asset paths. The named origin fixture serves a
    PHP tutorial body that triggers all three response rules when unsuppressed.
  enabled: true
  name: 9522801.yaml
tests:
  - test_title: 9522801-1
    desc: >
      A normal blog-post permalink serves the PHP tutorial body but must not
      trip a 9522xxx blocking rule or any of the three CRS-953 rules.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: Mozilla/5.0
          port: 80
          method: GET
          uri: /2026/05/zstd-nginx-module-what-it-does-bugs-fixed/
        output:
          no_log_contains: 'id "(?:9522[0-9]+|953100|953110|953120)"'

  - test_title: 9522801-2
    desc: >
      Existing request-rule control: 9522104 still fires for /?author=N.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: Mozilla/5.0
          port: 80
          method: GET
          uri: /?author=1
        output:
          log_contains: id "9522104"

  - test_title: 9522801-3
    desc: >
      A second permalink shape serves the same PHP tutorial body and remains
      free of plugin and CRS-953 matches.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: Mozilla/5.0
          port: 80
          method: GET
          uri: /2026/05/postfix-dovecot-setup-debian/
        output:
          no_log_contains: 'id "(?:9522[0-9]+|953100|953110|953120)"'

  - test_title: 9522801-4
    desc: Admin responses retain the CRS PHP error detector.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: Mozilla/5.0}
          port: 80
          method: GET
          uri: /wp-admin/953-response-oracle
        output:
          log_contains: 'id "953100"'

  - test_title: 9522801-5
    desc: REST responses retain the PHP source and open-tag detectors.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: Mozilla/5.0}
          port: 80
          method: GET
          uri: /wp-json/953-response-oracle
        output:
          log_contains: 'id "953110"'

  - test_title: 9522801-6
    desc: REST responses retain the PHP open-tag detector.
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: Mozilla/5.0}
          port: 80
          method: GET
          uri: /wp-json/953-response-oracle
        output:
          log_contains: 'id "953120"'
