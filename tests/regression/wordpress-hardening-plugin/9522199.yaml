---
meta:
  author: Thijs Eilander
  description: Static asset shortcut must preserve sensitive-file detection
  enabled: true
  name: 9522199.yaml
tests:
  - test_title: 9522199-1
    desc: PHP origin can execute wp-config.php with a CSS PATH_INFO suffix
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-config.php/extra.css
        output:
          log_contains: id "9522202"
  - test_title: 9522199-2
    desc: PHP origin can execute install.php with a JS PATH_INFO suffix
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-admin/install.php/extra.js
        output:
          log_contains: id "9522202"
  - test_title: 9522199-3
    desc: Sensitive directory before an inert extension remains guarded
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-content/mu-plugins/extra.css
        output:
          log_contains: id "9522202"
  - test_title: 9522199-4
    desc: Ordinary theme CSS remains outside the sensitive-file guard
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-content/themes/site/style.css
        output:
          no_log_contains: id "9522202"
  - test_title: 9522199-5
    desc: Ordinary WordPress JS remains outside the sensitive-file guard
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-includes/js/jquery.js
        output:
          no_log_contains: id "9522202"
  - test_title: 9522199-6
    desc: Plugin asset with a wp-config-like filename remains benign
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-content/plugins/wp-config-tools/style.css
        output:
          no_log_contains: id "9522202"
  - test_title: 9522199-7
    desc: Guide asset with a wp-config-like directory remains benign
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /blog/wp-config-guide/style.css
        output:
          no_log_contains: id "9522202"
  - test_title: 9522199-8
    desc: Backup extension inside plugin path still triggers extension protector
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-content/plugins/test.bak/extra.css
        output:
          log_contains: id "9522206"
  - test_title: 9522199-9
    desc: Sensitive directory backup still triggers data protector
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-content/mu-plugins.bak/extra.css
        output:
          log_contains: id "9522202"
  - test_title: 9522199-10
    desc: Config backup directory still triggers data protector
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-config-backup/extra.css
        output:
          log_contains: id "9522202"
  - test_title: 9522199-11
    desc: Arbitrary config suffix follows the existing data-token policy
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-config-arbitrary/extra.css
        output:
          log_contains: id "9522202"
  - test_title: 9522199-12
    desc: Arbitrary mu-plugins suffix follows the existing data-token policy
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-content/mu-plugins-arbitrary/extra.css
        output:
          log_contains: id "9522202"
  - test_title: 9522199-13
    desc: Nested guide path cannot inherit the exact benign static exception
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-config.php/blog/wp-config-guide/style.css
        output:
          log_contains: id "9522202"
  - test_title: 9522199-14
    desc: Nested plugin path cannot inherit the exact benign static exception
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-config.php/wp-content/plugins/wp-config-tools/style.css
        output:
          log_contains: id "9522202"
