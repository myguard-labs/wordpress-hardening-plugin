---
meta:
  author: Thijs Eilander
  description: wordpress-hardening-plugin
  enabled: true
  name: 9522115.yaml
tests:
  - test_title: 9522115-1
    desc: CI enables the opt-in rule, so an unencoded plugin readme is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/plugins/akismet/readme.txt
        output:
          log_contains: id "9522115"
  - test_title: 9522115-2
    desc: Encoded plugin readme path is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/plugins/akismet/readm%65.txt
        output:
          log_contains: id "9522115"
  - test_title: 9522115-3
    desc: Negative — an encoded ordinary plugin asset path is allowed
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/plugins/akismet/ass%65ts/main.css
        output:
          no_log_contains: id "9522115"
  - test_title: 9522115-4
    desc: Double-encoded plugin readme path is not decoded twice
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/plugins/akismet/readm%2565.txt
        output:
          no_log_contains: id "9522115"
  - test_title: 9522115-5
    desc: Default-disabled readme gate does not block a matching request
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            X-WPHard-Test-Readme-Default: "1"
          port: 80
          method: GET
          uri: /wp-content/plugins/akismet/readme.txt
        output:
          no_log_contains: id "9522115"
  - test_title: 9522115-6
    desc: Encoded question mark remains part of the readme path
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/plugins/akismet/readme.txt%3Fx
        output:
          no_log_contains: id "9522115"
  - test_title: 9522115-7
    desc: A real query separator after readme stays blocked when enabled
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/plugins/akismet/readme.txt?x=1
        output:
          log_contains: id "9522115"
