---
meta:
  author: Thijs Eilander
  description: wordpress-hardening-plugin
  enabled: true
  name: 9522100.yaml
tests:
  - test_title: 9522100-1
    desc: readme.html probe is blocked in phase:1
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /readme.html
        output:
          log_contains: id "9522100"
  - test_title: 9522100-2
    desc: license.txt probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /license.txt
        output:
          log_contains: id "9522100"
  - test_title: 9522100-3
    desc: .user.ini probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /.user.ini
        output:
          log_contains: id "9522100"
  - test_title: 9522100-4
    desc: wp-admin/install.php probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/install.php
        output:
          log_contains: id "9522100"
  - test_title: 9522100-5
    desc: wp-admin/setup-config.php probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/setup-config.php
        output:
          log_contains: id "9522100"
  - test_title: 9522100-6
    desc: wp-includes/wlwmanifest.xml probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-includes/wlwmanifest.xml
        output:
          log_contains: id "9522100"
  - test_title: 9522100-7
    desc: wp-content/debug.log probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/debug.log
        output:
          log_contains: id "9522100"
  - test_title: 9522100-8
    desc: Negative — legitimate post URL containing 'license' must not match
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /blog/software-license-explained
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-9
    desc: Encoded readme.html probe (%65) is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /r%65adme.html
        output:
          log_contains: id "9522100"
  - test_title: 9522100-10
    desc: Encoded license.txt probe (%2E) is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /license%2Etxt
        output:
          log_contains: id "9522100"
  - test_title: 9522100-11
    desc: Encoded wp-admin/install.php probe (%2e) is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/install%2ephp
        output:
          log_contains: id "9522100"
  - test_title: 9522100-12
    desc: Encoded wp-content/debug.log probe with query string is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/debug%2elog?x=1
        output:
          log_contains: id "9522100"
  - test_title: 9522100-13
    desc: Uppercase-hex encoded README.HTML probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /%52EADME%2eHTML
        output:
          log_contains: id "9522100"
  - test_title: 9522100-14
    desc: Negative - double-encoded readme.html is not decoded twice
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /r%2565adme.html
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-15
    desc: Negative - benign percent-encoded path must not match
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /blog/caf%C3%A9-readme%20notes
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-16
    desc: Negative - sensitive name only in the query string must not match
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /search?q=%2freadme.html
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-17
    desc: Absolute-form encoded readme.html probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: http://localhost/r%65adme.html?x=1
        output:
          log_contains: id "9522100"
  - test_title: 9522100-18
    desc: Negative - absolute-form, sensitive name only in query
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: http://localhost/search?q=%2freadme.html
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-19
    desc: Negative - absolute-form double-encoded readme.html
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: http://localhost/r%2565adme.html
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-20
    desc: Installer trailing slash remains protected
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-admin/install.php/
        output:
          log_contains: id "9522100"
  - test_title: 9522100-21
    desc: Installer PATH_INFO remains protected
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-admin/install.php/extra
        output:
          log_contains: id "9522100"
  - test_title: 9522100-22
    desc: Setup PATH_INFO remains protected
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-admin/setup-config.php/extra
        output:
          log_contains: id "9522100"
  - test_title: 9522100-23
    desc: Installer PATH_INFO with a static suffix remains protected
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-admin/install.php/extra.css
        output:
          log_contains: id "9522100"
  - test_title: 9522100-24
    desc: Encoded installer filename with PATH_INFO remains protected
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-admin/install%2ephp/extra
        output:
          log_contains: id "9522100"
  - test_title: 9522100-25
    desc: Setup PATH_INFO with a query remains protected
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-admin/setup-config.php/extra?mode=check
        output:
          log_contains: id "9522100"
  - test_title: 9522100-26
    desc: Negative - installer filename near-miss
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-admin/install.php.bak
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-27
    desc: Negative - setup filename near-miss with a suffix
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-admin/setup-config.php.bak/extra
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-28
    desc: Static info-leak file with trailing slash
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /readme.html/
        output:
          log_contains: id "9522100"
  - test_title: 9522100-29
    desc: Static info-leak file with a suffix
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-content/debug.log/extra
        output:
          log_contains: id "9522100"
  - test_title: 9522100-30
    desc: Negative - double-encoded installer filename
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-admin/install%252ephp/extra
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-31
    desc: Negative - PATH_INFO appears only in the query
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /search?path=/wp-admin/install.php/extra
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-32
    desc: Static license with nested suffix
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /license.txt/extra/nested.css
        output:
          log_contains: id "9522100"
  - test_title: 9522100-33
    desc: Static PHP configuration with query after suffix
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /.user.ini/extra?mode=check
        output:
          log_contains: id "9522100"
  - test_title: 9522100-34
    desc: Static manifest with encoded separator
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-includes/wlwmanifest.xml%2fextra
        output:
          log_contains: id "9522100"
  - test_title: 9522100-35
    desc: Static log with encoded nested separators
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-content/debug.log%2Fextra%2fnested.css?mode=check
        output:
          log_contains: id "9522100"
  - test_title: 9522100-36
    desc: Encoded static filename with suffix
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /r%65adme.html/extra
        output:
          log_contains: id "9522100"
  - test_title: 9522100-37
    desc: Absolute-form static filename with suffix
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: http://localhost/license.txt/extra?mode=check
        output:
          log_contains: id "9522100"
  - test_title: 9522100-38
    desc: Negative - static filename backup near-miss
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /readme.html.bak/extra
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-39
    desc: Negative - static filename similar name
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /.user.inix/extra
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-40
    desc: Negative - double-encoded static separator
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /wp-content/debug.log%252fextra
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-41
    desc: Negative - static suffix appears only in query
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /search?path=/wp-includes/wlwmanifest.xml/extra
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-42
    desc: Negative - encoded question mark remains part of static filename
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS, Accept: '*/*'}
          port: 80
          method: GET
          uri: /license.txt%3fextra
        output:
          no_log_contains: id "9522100"
