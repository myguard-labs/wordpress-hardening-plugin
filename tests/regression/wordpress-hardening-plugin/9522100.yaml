---
meta:
  author: Thijs Eilander
  description: wordpress-hardening-plugin
  enabled: true
  name: 9522100.yaml
tests:
  - test_title: 9522100-1
    desc: readme.html probe is blocked in phase:1
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /readme.html
        output:
          log_contains: id "9522100"
  - test_title: 9522100-2
    desc: license.txt probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /license.txt
        output:
          log_contains: id "9522100"
  - test_title: 9522100-3
    desc: .user.ini probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /.user.ini
        output:
          log_contains: id "9522100"
  - test_title: 9522100-4
    desc: wp-admin/install.php probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/install.php
        output:
          log_contains: id "9522100"
  - test_title: 9522100-5
    desc: wp-admin/setup-config.php probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/setup-config.php
        output:
          log_contains: id "9522100"
  - test_title: 9522100-6
    desc: wp-includes/wlwmanifest.xml probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-includes/wlwmanifest.xml
        output:
          log_contains: id "9522100"
  - test_title: 9522100-7
    desc: wp-content/debug.log probe is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/debug.log
        output:
          log_contains: id "9522100"
  - test_title: 9522100-8
    desc: Negative — legitimate post URL containing 'license' must not match
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /blog/software-license-explained
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-9
    desc: Percent-encoded path character in readme.html is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /r%65adme.html
        output:
          log_contains: id "9522100"
  - test_title: 9522100-10
    desc: Percent-encoded path character in license.txt is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /lic%65nse.txt
        output:
          log_contains: id "9522100"
  - test_title: 9522100-11
    desc: Percent-encoded path character in wp-admin/install.php is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-admin/inst%61ll.php
        output:
          log_contains: id "9522100"
  - test_title: 9522100-12
    desc: Percent-encoded path character in wp-content/debug.log is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-content/deb%75g.log
        output:
          log_contains: id "9522100"
  - test_title: 9522100-13
    desc: Double-encoded readme.html path is not decoded twice
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /r%2565adme.html
        output:
          no_log_contains: id "9522100"
  - test_title: 9522100-14
    desc: >-
      Negative — percent-encoded character in a benign license article must
      not match
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /blog/software-lic%65nse-explained
        output:
          no_log_contains: id "9522100"
  - test_title: 9522113-encoded-1
    desc: Encoded .env path is blocked by the VCS and dotfile rule
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /.%65nv
        output:
          log_contains: id "9522113"
  - test_title: 9522114-encoded-1
    desc: Encoded wp-config.php backup path is blocked
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers: {Host: localhost, User-Agent: OWASP CRS}
          port: 80
          method: GET
          uri: /wp-config.php.b%61k
        output:
          log_contains: id "9522114"
