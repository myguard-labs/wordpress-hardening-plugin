---
on:  # yamllint disable-line rule:truthy
  push:
    branches: [master]
  pull_request:
name: Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-files:
    name: Validate Plugin Files
    runs-on: [self-hosted, builder02, lxc]
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: stable
          cache-dependency-path: tests/coraza/go.sum

      - name: CI unit tests
        run: |
          python3 -m venv "$RUNNER_TEMP/plugin-lint-venv"
          "$RUNNER_TEMP/plugin-lint-venv/bin/python" -m pip install \
            --disable-pip-version-check PyYAML==6.0.2 crs-linter==1.2.0
          export PATH="$RUNNER_TEMP/plugin-lint-venv/bin:$PATH"
          "$RUNNER_TEMP/plugin-lint-venv/bin/python" \
            ci/check_ftw_positives.py \
            tests/regression/wordpress-hardening-plugin \
            tests/integration/.ftw.yml
          "$RUNNER_TEMP/plugin-lint-venv/bin/python" -B -m unittest \
            discover -s ci -p 'test_*.py'

      - name: Validate plugin file references and IDs
        run: bash scripts/ci-local.sh --validate-files

  plugin-lint:
    needs: validate-files
    # Local copy of the OWASP CRS plugin lint checks. Repository policy permits
    # reusable workflows from this repository, but rejects external calls.
    uses: ./.github/workflows/plugin-lint.yml
