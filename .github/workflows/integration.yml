---
on:
  push:
    branches: [master]
  pull_request:
name: Integration Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-gates:
    name: Validate Gate Variables
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify gate coverage
        run: awk -f ci/check_gate_coverage.awk plugins/*.conf

      - name: Verify skipAfter only on chain-starter rules
        run: |
          # Regression guard for the AH00526 fatal:
          #   "ModSecurity: SkipAfter actions can only be specified by chain starter rules"
          # In a chained rule, skipAfter must live in the action list of the
          # CHAIN STARTER (the outer SecRule), never in the inner/secondary
          # SecRule. Track the chain action across continued lines rather than
          # relying on the inner rule's indentation.
          echo "Checking that no chained (inner) SecRule carries a skipAfter action..."
          if ! awk -f ci/check_chained_skipafter.awk plugins/*.conf; then
            echo "ERROR: skipAfter found on a chained (inner) SecRule."
            echo "       Move skipAfter into the chain-starter (outer) rule's action list."
            exit 1
          fi
          echo "✓ No chained rule carries skipAfter"

      - name: Verify every skipAfter target has a matching SecMarker
        run: |
          # A skipAfter:LABEL with no "SecMarker LABEL" jumps past the end of
          # the phase and silently disables every rule after it. Catch typos
          # and renamed markers.
          echo "Checking skipAfter targets resolve to a SecMarker..."
          MISSING=0
          while read -r label; do
            if ! grep -qE "SecMarker \"?${label}\"?" plugins/*.conf; then
              echo "ERROR: skipAfter:${label} has no matching SecMarker"
              MISSING=1
            fi
          done < <(grep -ohE 'skipAfter:[A-Za-z0-9_]+' plugins/*.conf | cut -d: -f2 | sort -u)
          [ "$MISSING" -eq 0 ] && echo "✓ All skipAfter targets resolve"
          [ "$MISSING" -eq 0 ] || exit 1

      - name: Verify regex extension anchors are escaped
        run: |
          # Regression guard for the 9522203 class: a file-extension
          # alternation like "(pl|cgi|sh)$" must be preceded by an ESCAPED dot
          # "\.", otherwise the "." is a regex wildcard and the rule matches
          # paths with no real extension (false positives) or is bypassable.
          # Flags an unescaped "." or a bare alternation immediately before a
          # known-extension-style group anchored with $.
          echo "Checking file-extension regexes use an escaped dot..."
          if grep -nE '@rx [^"]*[^\\]\((pl|cgi|py|sh|lua|aspx?|php|html?|sql)[^)]*\)[^"]*\$' plugins/*.conf \
               | grep -vE '\\\.\((pl|cgi|py|sh|lua|aspx?|php|html?|sql)'; then
            echo "ERROR: extension alternation not preceded by an escaped dot (\\.)"
            echo "       Use \\.(ext1|ext2)\$ so the dot is literal."
            exit 1
          fi
          echo "✓ Extension regexes properly anchored"

      - name: Verify markers are well-formed and reachable
        run: |
          # Two valid marker shapes:
          #  1. Feature gate: BEGIN_X / END_X pair (every BEGIN must have its
          #     END and vice-versa).
          #  2. Skip target: END_X (or bare label) with NO BEGIN, used purely
          #     as a skipAfter jump destination (PL gates, static fast-path).
          # Every marker, whichever shape, MUST be the target of at least one
          # skipAfter or it is unreachable dead code. This generalises the
          # per-feature checks so new gates/skip-targets are covered too.
          echo "Checking markers are well-formed and reachable..."
          BAD=0
          while read -r end; do
            begin="BEGIN_${end#END_}"
            if ! grep -qE "SecMarker \"${begin}\"" plugins/*.conf; then
              # skip-only target is allowed, but must be jumped to
              grep -qE "skipAfter:${end}\b" plugins/*.conf || { echo "ERROR: ${end} has no BEGIN_ and no skipAfter targets it (dead marker)"; BAD=1; }
            fi
            grep -qE "skipAfter:${end}\b" plugins/*.conf || { echo "ERROR: ${end} is never targeted by a skipAfter (dead gate)"; BAD=1; }
          done < <(grep -ohE 'SecMarker "END_[A-Z0-9_]+"' plugins/*.conf | sed 's/SecMarker "//;s/"//')
          while read -r begin; do
            end="END_${begin#BEGIN_}"
            grep -qE "SecMarker \"${end}\"" plugins/*.conf || { echo "ERROR: ${begin} has no matching ${end}"; BAD=1; }
          done < <(grep -ohE 'SecMarker "BEGIN_[A-Z0-9_]+"' plugins/*.conf | sed 's/SecMarker "//;s/"//')
          [ "$BAD" -eq 0 ] && echo "✓ All markers well-formed and reachable"
          [ "$BAD" -eq 0 ] || exit 1

      - name: Verify rule parameters
        run: |
          # Ensure required rule attributes are present
          echo "Validating rule parameter consistency..."
          for ruleid in 9522102 9522104 9522107 9522109 9522111 9522150 9522151 9522152 9522153 9522154 9522155 9522200 9522202 9522203 9522205 9522206 9522207 \
                        9522301 9522303 9522305 9522307 9522309 9522311 9522313 9522315 9522317 \
                        9522400 9522410 9522411 9522412 9522413 \
                        9522046 9522500 9522501 9522503 9522504 9522505 9522506 9522507 9522508 9522510 \
                        9522047 9522600 9522601 9522602 9522603 9522604; do
            if ! grep "id:$ruleid" plugins/*.conf > /dev/null; then
              echo "ERROR: Rule ID $ruleid not found"
              exit 1
            fi
          done
          echo "✓ All expected rules present"

  # The external `coreruleset/crs-plugin-test-action` integration job that
  # used to live here was superseded by:
  #   - .github/workflows/apache-modsecurity2.yml (real Apache + ModSec v2)
  #   - .github/workflows/nginx-libmodsecurity3.yml (real Angie + libmodsec3)
  # Apache/v2 runs the full go-ftw regression suite. The separate security
  # corpus workflow also runs on Apache/v2. nginx/v3 checks rule loading,
  # a positive/negative request smoke test, optional IP behavior and XFF trust.
  # coraza.yml checks loading plus targeted runtime fixtures, optional IP
  # behavior and XFF trust. Neither runs the full regression suite or corpus.
  # The static gate validation above runs without an engine.
