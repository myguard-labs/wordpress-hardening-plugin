---
on:
  push:
    branches: [master]
  pull_request:
name: Integration Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-gates:
    name: Validate Gate Variables
    runs-on: [self-hosted, builder02, lxc]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate gate structure and placement
        run: bash scripts/ci-local.sh --validate-gates

      - name: Verify rule parameters
        run: |
          # Ensure required rule attributes are present
          echo "Validating rule parameter consistency..."
          for ruleid in 9522102 9522104 9522107 9522109 9522111 9522150 9522151 9522152 9522153 9522154 9522155 9522200 9522202 9522203 9522205 9522206 9522207 \
                        9522301 9522303 9522305 9522307 9522309 9522311 9522313 9522315 9522317 \
                        9522400 9522410 9522411 9522412 9522413 \
                        9522046 9522500 9522501 9522503 9522504 9522505 9522506 9522507 9522508 9522510 \
                        9522047 9522600 9522601 9522602 9522603 9522604; do
            if ! grep "id:$ruleid" plugins/*.conf > /dev/null; then
              echo "ERROR: Rule ID $ruleid not found"
              exit 1
            fi
          done
          echo "✓ All expected rules present"

  # The external `coreruleset/crs-plugin-test-action` integration job that
  # used to live here was superseded by:
  #   - .github/workflows/apache-modsecurity2.yml (real Apache + ModSec v2)
  #   - .github/workflows/nginx-libmodsecurity3.yml (real Angie + libmodsec3)
  # Apache/v2 runs the full go-ftw regression suite. The separate security
  # corpus workflow also runs on Apache/v2. nginx/v3 checks rule loading,
  # a positive/negative request smoke test, optional IP behavior and XFF trust.
  # coraza.yml checks loading plus targeted runtime fixtures, optional IP
  # behavior and XFF trust. Neither runs the full regression suite or corpus.
  # The static gate validation above runs without an engine.
