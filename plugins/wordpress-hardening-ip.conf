# OWASP CRS Plugin
# Plugin name: wordpress-hardening-plugin
# Plugin description: harden wordpress, minimize php/sql impact
# Rule ID block base: 9,522,000-9,522,999
# Plugin version: 1.2.0

# This file is opt-in: its name matches none of the CRS plugin loader globs.
# Include AFTER config/operator overrides and BEFORE wordpress-hardening-before.conf.
# It supplies client identity, private-client exemptions, and IP reputation on
# all three engines. GeoIP and persistent login rate limiting remain separate.
#
# The main kill-switch has not run yet. Preserve its explicit-disable predicate,
# checking presence first so an unset flag still receives the main default=1.
# Phase-scoped skipAfter also covers SecAction: libmodsecurity3 does not
# honour runtime ruleRemoveById for unconditional actions. Keep the phase-two
# guard before reputation; the main kill-switch also removes its rule IDs.
SecRule &TX:wordpress-hardening-plugin_enabled "@gt 0" \
    "id:9522069,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'wordpress-hardening-plugin/1.2.0',\
    chain,\
    skipAfter:END_WPHARD_IP"
    SecRule TX:wordpress-hardening-plugin_enabled "@eq 0" "t:none"

SecRule &TX:wordpress-hardening-plugin_enabled "@gt 0" \
    "id:9522070,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    ver:'wordpress-hardening-plugin/1.2.0',\
    chain,\
    skipAfter:END_WPHARD_IP"
    SecRule TX:wordpress-hardening-plugin_enabled "@eq 0" "t:none"

# Default: IP reputation blocklist disabled
SecRule &TX:wphard.ip_reputation_enabled "@eq 0" \
  "phase:1,\
  id:9522047,\
  pass,\
  nolog,\
  setvar:tx.wphard.ip_reputation_enabled=0"

# Default: require an explicitly listed upstream proxy before honouring XFF.
# The shipped trusted-proxies file is empty, so the default uses REMOTE_ADDR.
# Populate it with the CIDRs of proxies that overwrite XFF. Explicitly setting
# trusted_proxies_enabled=0 retains legacy unconditional trust (unsafe on a
# directly reachable server).
SecRule &TX:wphard.trusted_proxies_enabled "@eq 0" \
  "phase:1,\
  id:9522050,\
  pass,\
  nolog,\
  setvar:tx.wphard.trusted_proxies_enabled=1"

# ─── TRUSTED CLIENT IP RESOLUTION (phase 1) ─────────────────────────────────
#
# All IP-based decisions (whitelists, rate-limit key, IP-reputation) must use
# ONE consistently-derived client IP. This resolver builds TX:wphard.client_ip:
#
#   1. Default to REMOTE_ADDR (the directly-connected peer).
#   2. If X-Forwarded-For is present (and either the trusted-proxies gate is
#      OFF, or REMOTE_ADDR is in the trusted-proxies list), take ONLY the
#      FIRST hop (the left-most value, i.e. the original client per the XFF
#      spec). Both IPv4 and IPv6 first hops are recognised; a malformed or
#      multi-value header that does not yield a clean first IP is ignored
#      (we keep REMOTE_ADDR).
#
# SECURITY: X-Forwarded-For is still attacker-controlled unless a trusted proxy
# overwrites it. This resolver removes the *multi-value* and *malformed-header*
# bypass classes (an attacker can no longer smuggle a private IP as the 2nd+
# token, nor inject junk), and — crucially — it makes the rate-limit counter
# and every whitelist key off the SAME value, closing the inconsistency where
# whitelists used XFF but the limiter used REMOTE_ADDR. It does NOT, and cannot,
# make a forgeable header trustworthy: deploy behind a proxy that sets/strips
# XFF. Pin accepted upstreams in wordpress-hardening-trusted-proxies.data.
SecAction \
  "id:9522060,\
  phase:1,\
  pass,\
  nolog,\
  setvar:tx.wphard.client_ip=%{REMOTE_ADDR}"

# Trusted-proxy gate. Default tx.wphard.xff_trusted=1 (XFF honoured), then if
# tx.wphard.trusted_proxies_enabled is nonzero, downgrade to 0 unless REMOTE_ADDR
# is in the trusted_proxies data file. The default requires explicit proxy
# pinning; only an explicit 0 retains legacy behaviour. Unsupported values fail closed.
SecAction \
  "id:9522064,\
  phase:1,\
  pass,\
  nolog,\
  setvar:tx.wphard.xff_trusted=1"

SecRule TX:wphard.trusted_proxies_enabled "!@streq 0" \
  "id:9522065,\
  phase:1,\
  pass,\
  t:none,\
  nolog,\
  ver:'wordpress-hardening-plugin/1.2.0',\
  chain"
  SecRule REMOTE_ADDR "!@ipMatchFromFile wordpress-hardening-trusted-proxies.data" \
    "t:none,setvar:tx.wphard.xff_trusted=0"

# First hop of XFF only: ^\s*<ipv4> followed by an optional decimal
# port (1-65535, no leading zero), then optional whitespace and a comma or
# end-of-string. Capture group 1 is the address. The trailing \s*(?:,|$)
# rejects malformed first hops like "1.2.3.4 junk".
# A consuming group, not a (?=...) lookahead: RE2 (Coraza) has no
# lookaround and fails the whole ruleset at load. Group 1 is unaffected.
# Gated on xff_trusted so an operator with trusted_proxies_enabled=1 cannot be
# fooled by XFF from a non-upstream peer.
SecRule TX:wphard.xff_trusted "@eq 1" \
  "id:9522061,\
  phase:1,\
  pass,\
  nolog,\
  chain"
  SecRule REQUEST_HEADERS:X-Forwarded-For \
    "@rx ^\s*((?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3})(?::(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?\s*(?:,|$)" \
    "t:none,capture,setvar:tx.wphard.client_ip=%{TX.1},setvar:tx.wphard.xff_parsed=1"

# IPv6 first hop of XFF: RFC 3986 IPv6address grammar (RFC 4291 addresses).
# Each alternative accounts for exactly eight 16-bit groups; a dotted IPv4
# tail occupies two groups and :: replaces at least one. The nine alternatives
# cover the uncompressed form and each possible compression boundary.
# Brackets must be paired. Group 1 preserves the literal for the resolver;
# rule 9522067 removes brackets before reputation/rate-limit decisions.
# No lookaround or backreferences: this grammar also runs on Coraza's RE2.
SecRule TX:wphard.xff_trusted "@eq 1" \
  "id:9522062,\
  phase:1,\
  pass,\
  nolog,\
  chain"
  SecRule REQUEST_HEADERS:X-Forwarded-For \
    "@rx ^\s*(\[(?:(?:[0-9A-Fa-f]{1,4}:){6}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|::(?:[0-9A-Fa-f]{1,4}:){5}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:){4}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,1}[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:){3}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,2}[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:){2}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,3}[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:){1}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,4}[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,5}[0-9A-Fa-f]{1,4})?::[0-9A-Fa-f]{1,4}|(?:(?:[0-9A-Fa-f]{1,4}:){0,6}[0-9A-Fa-f]{1,4})?::)\]|(?:(?:[0-9A-Fa-f]{1,4}:){6}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|::(?:[0-9A-Fa-f]{1,4}:){5}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:){4}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,1}[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:){3}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,2}[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:){2}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,3}[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:){1}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,4}[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,5}[0-9A-Fa-f]{1,4})?::[0-9A-Fa-f]{1,4}|(?:(?:[0-9A-Fa-f]{1,4}:){0,6}[0-9A-Fa-f]{1,4})?::))\s*(?:,|$)" \
    "t:none,capture,setvar:tx.wphard.client_ip=%{TX.1},setvar:tx.wphard.xff_parsed=1"

# Bracketed IPv6 with a port uses a separate rule so capture group 1 stays
# address-only on all engines. The unbracketed rule above cannot accept a
# port suffix without also accepting malformed ambiguous IPv6 first hops.
SecRule TX:wphard.xff_trusted "@eq 1" \
  "id:9522068,\
  phase:1,\
  pass,\
  t:none,\
  nolog,\
  ver:'wordpress-hardening-plugin/1.2.0',\
  chain"
  SecRule REQUEST_HEADERS:X-Forwarded-For \
    "@rx ^\s*\[((?:(?:[0-9A-Fa-f]{1,4}:){6}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|::(?:[0-9A-Fa-f]{1,4}:){5}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:){4}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,1}[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:){3}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,2}[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:){2}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,3}[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:){1}(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,4}[0-9A-Fa-f]{1,4})?::(?:[0-9A-Fa-f]{1,4}:[0-9A-Fa-f]{1,4}|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9]))|(?:(?:[0-9A-Fa-f]{1,4}:){0,5}[0-9A-Fa-f]{1,4})?::[0-9A-Fa-f]{1,4}|(?:(?:[0-9A-Fa-f]{1,4}:){0,6}[0-9A-Fa-f]{1,4})?::))\](?::(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))\s*(?:,|$)" \
    "capture,t:none,setvar:tx.wphard.client_ip=%{TX.1},setvar:tx.wphard.xff_parsed=1"

# Brackets delimit an XFF IPv6 literal but are not part of the address used
# by IP reputation matching or the other client-IP decisions.
SecRule TX:wphard.client_ip "@rx ^\[([0-9A-Fa-f:.]+)\]$" \
  "id:9522067,\
  phase:1,\
  pass,\
  capture,\
  t:none,\
  nolog,\
  ver:'wordpress-hardening-plugin/1.2.0',\
  setvar:tx.wphard.client_ip=%{TX.1}"

# Phase-1 helper: classify the resolved client_ip as "private" (loopback +
# RFC 1918 for v4; IPv6 loopback ::1, Unique Local fc00::/7, and IPv4-mapped
# IPv6 ::ffff:<v4> for private-range IPv4) and store the result in
# tx.wphard.client_is_private. This collapses the six identical whitelist
# regexes into a single check, and gives every group an IPv6-aware
# private-network test for free.
#
# t:none,t:lowercase normalises hex casing on IPv6 values, allowing the regex to
# stay plain-ASCII without [fF][cCdD] case-class noise.
#
# The mapped prefix accepts five zero groups, expanded or compressed, before
# ffff. The ::ffff:<v4> branch is required because dual-stack proxies forward
# IPv4 clients as IPv4-mapped IPv6 (RFC 4291 §2.5.5.2). Without it,
# ::ffff:127.0.0.1 from a real loopback proxy fails the private check —
# see AUDIT-ROUND-5.md §1-P1.
SecRule TX:wphard.client_ip "@rx ^(?:127\.[0-9]+\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|(?:0{1,4}:){7}0{0,3}1|\[?::1\]?|(?:\[(?:fc|fd)[0-9a-f]{2}:[0-9a-f:.]+\]|(?:fc|fd)[0-9a-f]{2}:[0-9a-f:.]+)|\[?(?:(?:0{1,4}:){5}|::(?:0{1,4}:){0,4}|0{1,4}::(?:0{1,4}:){0,3}|0{1,4}:0{1,4}::(?:0{1,4}:){0,2}|(?:0{1,4}:){2}0{1,4}::(?:0{1,4}:){0,1}|(?:0{1,4}:){3}0{1,4}::)ffff:(?:127\.[0-9]+\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+)\]?)$" \
  "id:9522063,\
  phase:1,\
  pass,\
  t:none,t:lowercase,\
  nolog,\
  ver:'wordpress-hardening-plugin/1.2.0',\
  setvar:tx.wphard.client_is_private=1"

# A private peer must not lend its exemption when XFF is present but ignored:
# either the peer is unlisted or its first hop is malformed/empty. Keep the
# peer as client_ip for reputation/rate limiting; direct private peers without
# XFF and trusted peers with a parsed private first hop retain their exemption.
SecRule &REQUEST_HEADERS:X-Forwarded-For "@gt 0" \
  "id:9522066,\
  phase:1,\
  pass,\
  t:none,\
  nolog,\
  chain"
  SecRule &TX:wphard.xff_parsed "@eq 0" \
    "t:none,\
    setvar:tx.wphard.client_is_private=0"

# ─── RULE GROUP: IP REPUTATION BLOCKLIST ────────────────────────────────────
#
# Blocks all requests from IPs listed in wordpress-hardening-ip-reputation.data.
# Supports individual addresses and CIDR ranges (e.g. 198.51.100.0/24).
# The client IP comes from trusted X-Forwarded-For or REMOTE_ADDR.
# Loopback and RFC 1918 clients are exempt when directly connected without XFF
# or resolved from a trusted, parsed first hop.
#
# SECURITY NOTE: Keep trusted-proxy pinning enabled and list only proxies
# that overwrite client-supplied X-Forwarded-For.

# Gate: skip all IP reputation rules if feature is disabled
SecRule TX:wphard.ip_reputation_enabled "@eq 0" \
  "id:9522600,\
  phase:2,\
  pass,\
  nolog,\
  skipAfter:END_WPHARD_IP_REPUTATION"

# Whitelist: skip if the resolved trusted client IP is loopback or RFC 1918.
SecRule TX:wphard.client_is_private "@eq 1" \
  "id:9522601,\
  phase:2,\
  pass,\
  nolog,\
  skipAfter:END_WPHARD_IP_REPUTATION"

SecAction "id:9522602,phase:2,pass,nolog"

SecMarker "BEGIN_WPHARD_IP_REPUTATION"

# Block: the resolved trusted client IP matches the reputation blocklist.
# One rule now covers both the XFF and no-XFF cases because client_ip is
# already resolved (first XFF hop, else REMOTE_ADDR) in phase 1.
SecRule TX:wphard.client_ip "@ipMatchFromFile wordpress-hardening-ip-reputation.data" \
  "id:9522603,\
  phase:2,\
  t:none,\
  tag:'wordpress',\
  tag:'ip-reputation',\
  tag:'paranoia-level/1',\
  maturity:'1',\
  severity:'CRITICAL',\
  ver:'wordpress-hardening-plugin/1.2.0',\
  block,\
  logdata:'Blocked client IP: %{tx.wphard.client_ip}, URI: %{REQUEST_URI}',\
  msg:'Wordpress hardening: request from IP reputation blocklist',\
  setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Stable-ID no-op: 9522603 handles both the XFF and the no-XFF case via
# the resolved client_ip. This rule is retained only so the existing
# regression test 9522604.yaml has a matching rule ID.
SecAction "id:9522604,phase:2,pass,nolog"

SecMarker "END_WPHARD_IP_REPUTATION"

SecMarker "END_WPHARD_IP"
