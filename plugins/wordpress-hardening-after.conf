# OWASP CRS Plugin
# Plugin name: wordpress-hardening-plugin
# Plugin description: harden wordpress, minimize php/sql impact
# Rule ID block base: 9,522,000-9,522,999
# Plugin version: 1.2.0
#
# This file contains phase:1 anomaly-scoring rules that were previously in
# before.conf. Per the CRS plugin docs:
#
#     "Scoring in phase 1: Put in the plugin's _After-File_"
#
# (https://coreruleset.org/docs/4-about-plugins/4-2-writing-plugins/)
#
# The reason: tx.critical_anomaly_score (REQUEST-901-INITIALIZATION.conf
# id 901140) and tx.inbound_anomaly_score_pl1 (id 901200) are not yet set
# when *-before.conf runs in phase 1, so any setvar that depends on them
# is effectively a no-op and the rule fails to participate in the anomaly
# engine — see AUDIT-ROUND-5.md §1-P1.
#
# All gate variables (tx.wphard.block_*) are still default-set in
# before.conf and are available here unchanged.

# ============================================================================
# INFO-LEAK FILE HARD-BLOCK (phase:1)
# ----------------------------------------------------------------------------
# Block well-known WordPress info-leak paths in phase:1 so the rule fires
# *before* any upstream location-block redirect (which would otherwise 302
# the probe to a confusing target and bypass ModSec phase:2). These paths
# carry no legitimate traffic for an installed site:
#   /readme.html, /license.txt          (WordPress version disclosure)
#   /.user.ini                          (PHP per-directory config probe)
#   /wp-admin/install.php[/...]        (installer — completed installs only)
#   /wp-admin/setup-config.php[/...]   (installer step 2)
#   /wp-includes/wlwmanifest.xml        (Windows Live Writer manifest)
#   /wp-content/debug.log               (WP_DEBUG_LOG output)
# Returns 403 deterministically; respects the block_info_leak_files toggle.
# The path is captured from REQUEST_URI_RAW (undecoded on ModSecurity v2,
# libmodsecurity3 and Coraza alike) up to the raw '?' and URL-decoded exactly
# once, so /r%65adme.html is caught on every engine while a double-encoded
# /r%2565adme.html (which no origin serves as readme.html) is not.
# ============================================================================
SecRule TX:wphard.block_info_leak_files "@eq 1" \
  "id:9522100,\
  phase:1,\
  chain,\
  t:none,t:lowercase,t:normalizePath,\
  tag:'wordpress',\
  tag:'info-leak',\
  tag:'paranoia-level/1',\
  maturity:'1',\
  severity:'CRITICAL',\
  ver:'wordpress-hardening-plugin/1.2.0',\
  block,\
  logdata:'Request URI %{REQUEST_URI}',\
  msg:'Wordpress hardening: blocked info-leak path'"
  SecRule REQUEST_URI_RAW "@rx ^(?:[a-zA-Z][a-zA-Z0-9+.-]*://[^/?#]*)?([^?#]*)" \
    "capture,t:none,chain"
    SecRule TX:1 "@rx ^/(?:readme\.html|license\.txt|\.user\.ini|wp-admin/(?:install|setup-config)\.php(?:/.*)?|wp-includes/wlwmanifest\.xml|wp-content/debug\.log)$" \
      "t:none,t:urlDecodeUni,t:lowercase,t:normalizePath,\
      setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# ----------------------------------------------------------------------------
# CVE-2018-6389: /wp-admin/load-scripts.php and /wp-admin/load-styles.php
# accept a ?load=handle1,handle2,... parameter and concatenate the listed
# core JS/CSS files. Sum decoded values, including repeated and array keys.
# Reject totals >= 80 bytes, except for canonical load[chunk_N] keys whose
# values are each <= 128 bytes: those use a 1024-byte aggregate cutoff.
# PHP trims leading spaces in keys and ignores suffixes after an array index.
# Count these forms too, but keep them subject to the strict cutoff.
# Count and sum the same keys: collection selectors are case-insensitive.
# Only the exact-case canonical chunk-key counter grants the larger budget.
# Use \x20 in collection selectors to avoid whitespace splitting the target.
# ----------------------------------------------------------------------------
SecRule TX:wphard.block_load_scripts_dos "@eq 1" \
    "id:9522126,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'wordpress-hardening-plugin/1.2.0',\
    setvar:tx.wphard.load_limit=80,\
    setvar:tx.wphard.load_key_count=0,\
    setvar:tx.wphard.load_chunk_count=0,\
    setvar:tx.wphard.load_oversize=0,\
    setvar:tx.wphard.load_size=0"

SecRule TX:wphard.block_load_scripts_dos "@eq 1" \
    "id:9522127,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'wordpress-hardening-plugin/1.2.0',\
    chain"
    SecRule ARGS_NAMES "@rx (?is)\A\x20*load(?:\[[^]]*\].*)?\z" \
        "t:none,setvar:tx.wphard.load_key_count=+1"

SecRule TX:wphard.block_load_scripts_dos "@eq 1" \
    "id:9522128,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'wordpress-hardening-plugin/1.2.0',\
    chain"
    SecRule ARGS_NAMES "@rx \Aload\[chunk_[0-9]+\]\z" \
        "t:none,setvar:tx.wphard.load_chunk_count=+1"

SecRule TX:wphard.block_load_scripts_dos "@eq 1" \
    "id:9522129,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'wordpress-hardening-plugin/1.2.0',\
    chain"
    SecRule ARGS:/\Aload\[chunk_[0-9]+\]\z/ "@gt 128" \
        "t:none,t:length,setvar:tx.wphard.load_oversize=1"

SecRule TX:wphard.load_chunk_count "@gt 0" \
    "id:9522130,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'wordpress-hardening-plugin/1.2.0',\
    chain"
    SecRule TX:wphard.load_key_count "@eq %{tx.wphard.load_chunk_count}" \
        "t:none,chain"
        SecRule TX:wphard.load_oversize "@eq 0" \
            "t:none,setvar:tx.wphard.load_limit=1024"

SecRule TX:wphard.block_load_scripts_dos "@eq 1" \
    "id:9522131,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'wordpress-hardening-plugin/1.2.0',\
    chain"
    SecRule ARGS:/(?is)\A\x20*load(?:\[[^]]*\].*)?\z/ "@ge 0" \
        "t:none,t:length,setvar:'tx.wphard.load_size=+%{MATCHED_VAR}'"

SecRule TX:wphard.block_load_scripts_dos "@eq 1" \
  "id:9522112,\
  phase:1,\
  chain,\
  t:none,t:lowercase,t:normalizePath,\
  tag:'wordpress',\
  tag:'cve-2018-6389',\
  tag:'dos',\
  tag:'paranoia-level/1',\
  maturity:'1',\
  severity:'CRITICAL',\
  ver:'wordpress-hardening-plugin/1.2.0',\
  block,\
  logdata:'Request URI %{REQUEST_URI}',\
  msg:'Wordpress hardening: CVE-2018-6389 load-scripts/load-styles DoS attempt'"
  SecRule REQUEST_URI_RAW "@rx ^(?:[a-zA-Z][a-zA-Z0-9+.-]*://[^/?#]*)?([^?#]*)" \
    "capture,t:none,chain"
    SecRule TX:1 "@rx ^/wp-admin/load-(?:scripts|styles)\.php$" \
      "t:none,t:urlDecodeUni,t:lowercase,t:normalizePath,chain"
      SecRule TX:wphard.load_size "@ge %{tx.wphard.load_limit}" \
        "t:none,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# ----------------------------------------------------------------------------
# Block access to VCS metadata and dotfile secrets.
#   /.env, /.env.local, /.env.*       (Laravel/CI conventions creeping into WP)
#   /.git/, /.svn/, /.hg/, /.bzr/     (repo metadata exposing source+history)
#   /.htpasswd, /.htaccess (in body)  (already in 9522206 but we want phase:1)
# ----------------------------------------------------------------------------
SecRule TX:wphard.block_vcs_paths "@eq 1" \
  "id:9522113,\
  phase:1,\
  chain,\
  tag:'wordpress',\
  tag:'info-leak',\
  tag:'vcs-metadata',\
  tag:'paranoia-level/1',\
  maturity:'1',\
  severity:'CRITICAL',\
  ver:'wordpress-hardening-plugin/1.2.0',\
  block,\
  logdata:'Request URI %{REQUEST_URI}',\
  msg:'Wordpress hardening: blocked VCS / dotfile probe'"
  SecRule REQUEST_URI_RAW "@rx ^(?:[a-zA-Z][a-zA-Z0-9+.-]*://[^/?#]*)?([^?#]*)" \
    "capture,t:none,chain"
    SecRule TX:1 "@rx (?:^|/)(?:\.env(?:\.[a-z0-9_-]+)?|\.git(?:/.*|$|ignore|attributes|modules|config|hooks)|\.svn(?:/.*|$)|\.hg(?:/.*|$|ignore|rc)|\.bzr(?:/.*|$)|\.ds_store|\.htpasswd)(?:$|/)" \
      "t:none,t:urlDecodeUni,t:lowercase,t:normalizePath,\
      setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# ----------------------------------------------------------------------------
# Block wp-config.php backup variants. The base 9522206 regex catches some
# (.bak/.orig/.swp) but misses .save, .old, .php~, .php.txt, .php.bak, and
# numeric backups (wp-config.php.1, .2, etc). All of these would serve the
# raw file as text since they aren't .php anymore.
# ----------------------------------------------------------------------------
SecRule TX:wphard.block_wpconfig_backups "@eq 1" \
  "id:9522114,\
  phase:1,\
  chain,\
  t:none,t:lowercase,t:normalizePath,\
  tag:'wordpress',\
  tag:'info-leak',\
  tag:'config-leak',\
  tag:'paranoia-level/1',\
  maturity:'1',\
  severity:'CRITICAL',\
  ver:'wordpress-hardening-plugin/1.2.0',\
  block,\
  logdata:'Request URI %{REQUEST_URI}',\
  msg:'Wordpress hardening: wp-config backup variant probe'"
  SecRule REQUEST_URI_RAW "@rx ^(?:[a-zA-Z][a-zA-Z0-9+.-]*://[^/?#]*)?([^?#]*)" \
    "capture,t:none,chain"
    SecRule TX:1 "@rx ^/wp-config(?:\.php)?(?:\.(?:bak|backup|save|old|new|orig|tmp|swp|swo|txt|inc|dist|sample|copy|[0-9]+)|~)$" \
      "t:none,t:urlDecodeUni,t:lowercase,t:normalizePath,\
      setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# ----------------------------------------------------------------------------
# Optional: block plugin/theme version disclosure via readme.txt and
# style.css headers. Attackers scrape these to map installed-version → CVE.
# Disabled by default because some legitimate tooling fetches readme.txt
# (wp-cli, update checkers) — enable only behind a tight allowlist or when
# you accept that minor breakage.
# ----------------------------------------------------------------------------
SecRule TX:wphard.block_plugin_readme "@eq 1" \
  "id:9522115,\
  phase:1,\
  chain,\
  t:none,t:lowercase,t:normalizePath,\
  tag:'wordpress',\
  tag:'info-leak',\
  tag:'version-disclosure',\
  tag:'paranoia-level/2',\
  maturity:'1',\
  severity:'CRITICAL',\
  ver:'wordpress-hardening-plugin/1.2.0',\
  block,\
  logdata:'Request URI %{REQUEST_URI}',\
  msg:'Wordpress hardening: plugin/theme version disclosure probe'"
  SecRule REQUEST_URI_RAW "@rx ^(?:[a-zA-Z][a-zA-Z0-9+.-]*://[^/?#]*)?([^?#]*)" \
    "capture,t:none,chain"
    SecRule TX:1 "@rx ^/wp-content/(?:plugins|themes|mu-plugins)/[^/]+/(?:readme(?:\.txt|\.md)|changelog\.txt|license\.txt)$" \
      "t:none,t:urlDecodeUni,t:lowercase,t:normalizePath,\
      setvar:'tx.inbound_anomaly_score_pl2=+%{tx.critical_anomaly_score}'"

# ----------------------------------------------------------------------------
# HTTP method restriction on WordPress paths. Only GET/POST/HEAD/OPTIONS are
# legitimate on /wp-admin, /wp-login.php, /xmlrpc.php. /wp-json may also use
# PUT/DELETE/PATCH for authenticated REST writes, so it's excluded here.
# Blocks TRACE/TRACK/DEBUG/PROPFIND/MKCOL/COPY/MOVE/LOCK/UNLOCK probes.
# ----------------------------------------------------------------------------
SecRule TX:wphard.block_uncommon_methods "@eq 1" \
  "id:9522119,\
  phase:1,\
  chain,\
  t:none,t:lowercase,t:normalizePath,\
  tag:'wordpress',\
  tag:'http-method',\
  tag:'paranoia-level/1',\
  maturity:'1',\
  severity:'CRITICAL',\
  ver:'wordpress-hardening-plugin/1.2.0',\
  block,\
  logdata:'Method %{REQUEST_METHOD} on %{REQUEST_URI}',\
  msg:'Wordpress hardening: uncommon HTTP method on WP path'"
  SecRule REQUEST_URI_RAW "@rx ^(?:[a-zA-Z][a-zA-Z0-9+.-]*://[^/?#]*)?([^?#]*)" \
    "capture,t:none,chain"
    SecRule TX:1 "@rx ^/(?:wp-admin/|wp-login\.php|xmlrpc\.php|wp-cron\.php)" \
      "t:none,t:urlDecodeUni,t:lowercase,t:normalizePath,chain"
      SecRule REQUEST_METHOD "!@rx ^(?:get|post|head|options)$" \
        "t:none,t:lowercase,\
        setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# ----------------------------------------------------------------------------
# Legacy CVE scanner noise reduction. These plugins are long dead or patched
# years ago but still drive a constant stream of background-noise scans.
# Returning 403 here means our backend never serves the request and our logs
# stay readable.
#   - Slider Revolution (revslider) LFI / RCE — CVE-2014-9734, 2015-3324
#   - TimThumb RFI — 2011 era
#   - WP Symposium 0-day — 2014
#   - MailPoet wysija captcha LFI — 2014
#   - File Manager (wp-file-manager) connector.minimal.php RCE — CVE-2020-25213
#   - Duplicator package exposure — CVE-2020-11738
# ----------------------------------------------------------------------------
# Inspect the raw path separately so URL decoding cannot create query syntax.
# A decoded question mark still ends path signature matching.
SecRule TX:wphard.block_legacy_cves "@eq 1" \
  "id:9522123,phase:1,pass,nolog,t:none,chain"
  SecRule REQUEST_URI_RAW "@rx ^(?:[a-zA-Z][a-zA-Z0-9+.-]*://[^/?#]*)?(/[^?#]*)" \
    "capture,t:none,chain"
    SecRule TX:1 "@rx ^[^?]*(?:[^?=&]revslider_(?:show_image|ajax_action)|timthumb\.php|/wp-symposium/|/mailpoet/[^?]*wysija[_-]?captcha|/wp-file-manager/[^?]*connector\.minimal\.php|installer-backup\.php)" \
      "t:none,t:urlDecodeUni,t:lowercase,\
      setvar:'tx.wphard.legacy_probe=1'"

# ARGS_GET splits only on raw delimiters, then decodes parameter names/values.
SecRule TX:wphard.block_legacy_cves "@eq 1" \
  "id:9522124,phase:1,pass,nolog,t:none,chain"
  SecRule ARGS_GET:action "@rx ^revslider_(?:show_image|ajax_action)$" \
    "t:none,t:lowercase,setvar:'tx.wphard.legacy_probe=1'"

SecRule TX:wphard.block_legacy_cves "@eq 1" \
  "id:9522125,phase:1,pass,nolog,t:none,chain"
  SecRule REQUEST_URI_RAW "@rx ^(?:[a-zA-Z][a-zA-Z0-9+.-]*://[^/?#]*)?(/[^?#]*)" \
    "capture,t:none,chain"
    SecRule TX:1 "@rx installer\.php$" \
      "t:none,t:urlDecodeUni,t:lowercase,t:normalizePath,chain"
      SecRule ARGS_GET_NAMES "@streq dup-uninstall" \
        "t:none,t:lowercase,setvar:'tx.wphard.legacy_probe=1'"

# Keep the public rule ID and anomaly score for every legacy probe.
SecRule TX:wphard.legacy_probe "@eq 1" \
  "id:9522120,\
  phase:1,\
  t:none,\
  tag:'wordpress',\
  tag:'legacy-cve',\
  tag:'paranoia-level/1',\
  maturity:'1',\
  severity:'CRITICAL',\
  ver:'wordpress-hardening-plugin/1.2.0',\
  block,\
  logdata:'Legacy CVE probe: %{REQUEST_URI}',\
  msg:'Wordpress hardening: legacy CVE scanner probe',\
  setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
